<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facilities - Facility Reservation</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .facility-card {
      background: #f9f9f9;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 15px;
    }
    .status-Active { color: green; font-weight: bold; }
    .status-Maintenance { color: red; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background-color: #4CAF50; color: white; }
  </style>
</head>
<body>
  <div class="container" style="max-width: 800px;">
    <h1>Facilities</h1>
    <p>Welcome, <span id="userName"></span> (<span id="userRole"></span>)</p>
    
    <div id="adminSection" style="display: none; margin-bottom: 30px;">
      <h2>Add New Facility</h2>
      <form id="addFacilityForm">
        <div class="form-group">
          <label>Facility Name</label>
          <input type="text" id="facilityName" required>
        </div>
        <div class="form-group">
          <label>Description</label>
          <input type="text" id="facilityDesc">
        </div>
        <div class="form-group">
          <label>Capacity</label>
          <input type="number" id="facilityCapacity" min="1">
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="facilityStatus">
            <option value="Active">Active</option>
            <option value="Maintenance">Maintenance</option>
          </select>
        </div>
        <button type="submit">Add Facility</button>
      </form>
    </div>

    <h2>List of Facilities</h2>
    <div id="facilitiesList">Loading...</div>

    <br>
    <a href="index.html">← Back to Dashboard</a> | 
    <button onclick="logout()">Logout</button>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/facilities.js"></script>
</body>
</html>
